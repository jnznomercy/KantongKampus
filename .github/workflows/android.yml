name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Cek rahasia penandatangan
        run: |
          for v in KS_B64 KS_PASS KS_ALIAS KEY_PASS; do
            if [ -z "${!v}" ]; then echo "::error::Secret untuk $v belum diisi (Settings > Secrets and variables > Actions)"; exit 1; fi
          done

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Pasang dependensi
        working-directory: mobile
        run: npm install

      - name: Buat proyek Android
        working-directory: mobile
        run: npx cap add android

      - name: Buat ikon aplikasi
        working-directory: mobile
        run: npx capacitor-assets generate --android

      - name: Atur nomor versi
        working-directory: mobile/android/app
        run: |
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/" build.gradle
          sed -i -E "s/versionName \"[^\"]*\"/versionName \"1.0.${{ github.run_number }}\"/" build.gradle
          grep -nE "versionCode|versionName" build.gradle

      - name: Sinkronkan
        working-directory: mobile
        run: npx cap sync android

      - name: Build APK release
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Tanda tangani APK
        run: |
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          IN="mobile/android/app/build/outputs/apk/release/app-release-unsigned.apk"
          "$BT/zipalign" -p -f 4 "$IN" aligned.apk
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.keystore" --ks-key-alias "$KS_ALIAS" \
            --ks-pass env:KS_PASS --key-pass env:KEY_PASS --out KantongKampus.apk aligned.apk
          "$BT/apksigner" verify --print-certs KantongKampus.apk

      - uses: actions/upload-artifact@v4
        with:
          name: KantongKampus-apk
          path: KantongKampus.apk

      - name: Terbitkan ke Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" KantongKampus.apk \
            --title "KantongKampus 1.0.${{ github.run_number }}" \
            --notes "APK Android KantongKampus." --latest

